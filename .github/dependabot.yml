version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "MikePfunk28"
    labels:
      - "dependencies"
    groups:
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      aws:
        patterns:
          - "@aws-sdk/*"
      sentry:
        patterns:
          - "@sentry/*"
      dev-dependencies:
        dependency-type: "development"
    security-updates-only: false

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
